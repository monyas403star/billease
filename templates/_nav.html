<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard_page') }}">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="BillEase">
    <span>BillEase</span>
  </a>
  <button class="nav-toggle" id="nav-toggle" aria-label="{{ t('תפריט') }}">☰</button>
  <nav class="topnav" id="topnav">
    <a href="{{ url_for('dashboard_page') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      {{ t("דשבורד") }}
    </a>
    <a href="{{ url_for('add_bill_page') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      {{ t("הוספת חשבון") }}
    </a>
    <a href="{{ url_for('bills_page') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16l4-2 4 2 4-2 4 2V8l-6-6zM7 13h7v2H7v-2zm0-4h10v2H7V9z"/></svg>
      {{ t("החשבונות שלי") }}
    </a>
    <a href="{{ url_for('reports_page') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 9v12H1V9h4zm7-7v19h-4V2h4zm7 5v14h-4V7h4z"/></svg>
      {{ t("דוחות") }}
    </a>
    <a href="{{ url_for('ocr_log_page') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M9 2L7 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3l-2-2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
      {{ t('Scan history') }}
    </a>
    <a href="{{ url_for('profile_page') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
      {{ t("פרופיל") }}
    </a>
    {% if user and user.is_admin %}
    <a href="{{ url_for('admin_page') }}" class="admin-link">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 1l9 4v6c0 5.5-3.8 10.7-9 12-5.2-1.3-9-6.5-9-12V5l9-4z"/></svg>
      {{ t("מנהל") }}
    </a>
    {% endif %}
    <a class="logout" href="{{ url_for('logout') }}">
      <svg class="ic" viewBox="0 0 24 24"><path d="M17 7l-1.4 1.4 2.6 2.6H8v2h10.2l-2.6 2.6L17 17l5-5-5-5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4V5z"/></svg>
      {{ t("התנתקות") }}
    </a>
  </nav>
