{% extends "_base.html" %}
{% block title %}{{ t("התחברות - BillEase") }}{% endblock %}
{% block bodyclass %}auth-bg{% endblock %}
{% block content %}
<main class="auth-wrap">
  <section class="card auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="BillEase">
      <h1>BillEase</h1>
      <p class="muted">{{ t("ניהול חשבונות פשוט וברור") }}</p>
    </div>

    <form id="login-form" class="form">
      <label>{{ t("תעודת זהות") }}</label>
      <input name="user_id" type="text" required placeholder="{{ t('לדוגמה 123456789') }}" autocomplete="username">

      <label>{{ t("סיסמה") }}</label>
      <input name="password" type="password" required autocomplete="current-password">

      <button type="submit" class="btn primary">{{ t("התחברות") }}</button>
      <p class="form-msg" id="login-msg"></p>
    </form>

    <div class="auth-links">
      <a href="/recover">{{ t("שכחתי סיסמה") }}</a>
      <a href="/register">{{ t("הרשמה למערכת") }}</a>
    </div>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js', v='accountplans1') }}"></script>
{% endblock %}
