{% extends "_base.html" %}
{% block title %}התחברות - BillEase{% endblock %}
{% block bodyclass %}auth-bg{% endblock %}
{% block content %}
<main class="auth-wrap">
  <section class="card auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="BillEase">
      <h1>BillEase</h1>
      <p class="muted">ניהול חשבונות פשוט וברור</p>
    </div>

    <form id="login-form" class="form">
      <label>תעודת זהות</label>
      <input name="user_id" type="text" required placeholder="לדוגמה 123456789" autocomplete="username">

      <label>סיסמה</label>
      <input name="password" type="password" required autocomplete="current-password">

      <button type="submit" class="btn primary">התחברות</button>
      <p class="form-msg" id="login-msg"></p>
    </form>

    <div class="auth-links">
      <a href="/recover">שכחתי סיסמה</a>
      <a href="/register">הרשמה למערכת</a>
    </div>

    <p class="hint">משתמש לדוגמה: 123456789 / 1234</p>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
