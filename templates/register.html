{% extends "_base.html" %}
{% block title %}הרשמה - BillEase{% endblock %}
{% block bodyclass %}auth-bg{% endblock %}
{% block content %}
<main class="auth-wrap">
  <section class="card auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="BillEase">
      <h1>פתיחת חשבון</h1>
      <p class="muted">לוקח פחות מדקה</p>
    </div>

    <form id="register-form" class="form">
      <label>תעודת זהות</label>
      <input name="user_id" type="text" required placeholder="123456789">

      <label>שם מלא</label>
      <input name="full_name" type="text" required>

      <label>אימייל</label>
      <input name="email" type="email" required>

      <label>טלפון</label>
      <input name="phone" type="text" placeholder="050-1234567">

      <label>סיסמה</label>
      <input name="password" type="password" required minlength="4">

      <button type="submit" class="btn primary">הרשמה</button>
      <p class="form-msg" id="reg-msg"></p>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('root') }}">חזרה להתחברות</a>
    </div>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
