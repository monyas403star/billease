<!doctype html>
<html lang="{{ locale }}" dir="{{ text_direction }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
<link rel="manifest"
      href="{{ url_for('static', filename='manifest.webmanifest') }}">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BillEase">
<link rel="apple-touch-icon"
      href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <title>{% block title %}BillEase{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='business1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home_navigation.css', v='home2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/feedback.css', v='feedback1') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
  {% if user %}<link rel="stylesheet" href="{{ url_for('static', filename='css/chat_widget.css', v='chat1') }}">{% endif %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block content %}{% endblock %}
  {% if user and request.endpoint != 'home_page' %}
  <footer class="home-return"><a class="btn primary" href="{{ url_for('home_page') }}">{{ t('Back to home screen') }}</a></footer>
  {% endif %}
  <script id="billease-i18n" type="application/json">{{ {'locale': locale, 'messages': ui_catalog, 'catalogs': ui_catalogs}|tojson }}</script>
  <script src="{{ url_for('static', filename='js/i18n.js', v='loginplans2') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js', v='loginplans2') }}"></script>
  {% include '_assistant_widget.html' %}
  <script src="{{ url_for('static', filename='js/chat_widget.js', v='chat1') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
