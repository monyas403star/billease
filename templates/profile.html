{% extends "_base.html" %}
{% block title %}{{ t("פרופיל - BillEase") }}{% endblock %}
{% block content %}
{% include "_nav.html" %}
<main class="page">
  <div class="page-head">
    <h1>{{ t("הפרופיל שלי") }}</h1>
    <p class="muted">{{ t("עדכון פרטים. תעודת זהות לא ניתנת לשינוי.") }}</p>
  </div>

  <section class="card narrow">
    <form id="profile-form" class="form">
      <label>{{ t("תעודת זהות") }}</label>
      <input name="user_id" type="text" disabled>

      <label>{{ t("שם מלא") }}</label>
      <input name="full_name" type="text" required>

      <label>{{ t("אימייל") }}</label>
      <input name="email" type="email" required>

      <label>{{ t("טלפון") }}</label>
      <input name="phone" type="text">

      <label>{{ t("סיסמה חדשה (השאר ריק כדי לא לשנות)") }}</label>
      <input name="password" type="password" minlength="8">

      <button type="submit" class="btn primary">{{ t("שמירה") }}</button>
      <p class="form-msg" id="profile-msg"></p>
    </form>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/profile.js', v='payments2') }}"></script>
{% endblock %}
